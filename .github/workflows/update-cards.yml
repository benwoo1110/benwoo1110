name: Update GitHub cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - cards.json
      - package.json
      - package-lock.json
      - scripts/generate-cards.mjs
      - .github/workflows/update-cards.yml

permissions:
  contents: read

concurrency:
  group: update-github-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate all cards
        run: npm run cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/*.svg
          if git diff --cached --quiet; then
            echo "Cards are already up to date."
            exit 0
          fi
          git commit -m "Update GitHub cards"
          git push
